<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | MEDMOST Medical Tourism India</title>
  <meta name="description" content="Reset your MEDMOST account password safely via email." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
</head>
<body>

  <!-- Site Header Container -->
  <div id="site-header-container"></div>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-brand-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Account Security
          </div>
          <h1 class="auth-card-title">Reset Your Password</h1>
          <p class="auth-card-subtitle">
            Enter your registered email address and we'll send you a secure link to create a new password.
          </p>
        </div>

        <div class="auth-card-body">
          <!-- Notification Alert Container -->
          <div id="auth-alert" style="display: none;"></div>

          <form id="forgot-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="forgot-email">Account Email Address *</label>
              <input 
                type="email" 
                id="forgot-email" 
                name="email" 
                class="form-control" 
                placeholder="patient@example.com" 
                required 
                autocomplete="email" 
              />
            </div>

            <button type="submit" id="forgot-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
              Send Password Reset Link
            </button>
          </form>
        </div>

        <div class="auth-card-footer">
          Remembered your password? <a href="login.html">&larr; Back to Login</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Reusable Dynamic Footer -->
  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader();
      renderFooter();

      const form = document.getElementById('forgot-form');
      const submitBtn = document.getElementById('forgot-submit-btn');
      const alertBox = document.getElementById('auth-alert');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        showAlert('', 'hide');

        const email = document.getElementById('forgot-email').value.trim();

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showAlert('Please enter your valid registered email address.', 'error');
          document.getElementById('forgot-email').focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite; vertical-align:middle; margin-right:6px;"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
          Sending Link...
        `;

        try {
          await window.medmostAuth.resetPasswordForEmail(email);

          form.style.display = 'none';
          showAlert(`
            <strong>Reset Link Sent!</strong><br />
            If an account exists for <strong>${escapeHtml(email)}</strong>, a secure password-reset link has been delivered to your inbox.
            <br /><br />
            Please click the link inside that email to choose your new password. (Be sure to check your Spam / Junk folder if you do not see it within 2 minutes).
            <div style="margin-top:1.25rem;">
              <a href="login.html" class="btn btn-outline btn-sm" style="display:inline-block;">Return to Sign In</a>
            </div>
          `, 'success');
        } catch (err) {
          console.error('Password reset request error:', err);
          showAlert(err.message || 'Unable to send password reset email. Please verify your address or try again later.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Send Password Reset Link';
        }
      });

      function showAlert(html, type) {
        if (type === 'hide') {
          alertBox.style.display = 'none';
          alertBox.innerHTML = '';
          return;
        }

        alertBox.className = `auth-alert auth-alert-${type}`;
        alertBox.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            ${type === 'error' ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'}
          </svg>
          <div>${html}</div>
        `;
        alertBox.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
