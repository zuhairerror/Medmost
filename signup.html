<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Sign Up | MEDMOST Medical Tourism India</title>
  <meta name="description" content="Create a MEDMOST patient account to track consultation enquiries, access medical opinions, and coordinate care in India." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
</head>
<body>

  <!-- Site Header Container -->
  <div id="site-header-container"></div>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-brand-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Patient Portal
          </div>
          <h1 class="auth-card-title">Create Your Account</h1>
          <p class="auth-card-subtitle">
            Sign up to track your clinical consultations and coordinate treatment with top hospitals in India.
          </p>
        </div>

        <div class="auth-card-body">
          <!-- Notification Alert Container -->
          <div id="auth-alert" style="display: none;"></div>

          <form id="signup-form" novalidate>
            <!-- Full Name -->
            <div class="form-group">
              <label class="form-label" for="signup-name">Full Name *</label>
              <input 
                type="text" 
                id="signup-name" 
                name="name" 
                class="form-control" 
                placeholder="e.g. Elena Volkova" 
                required 
                autocomplete="name" 
              />
            </div>

            <!-- Email Address -->
            <div class="form-group">
              <label class="form-label" for="signup-email">Email Address *</label>
              <input 
                type="email" 
                id="signup-email" 
                name="email" 
                class="form-control" 
                placeholder="patient@example.com" 
                required 
                autocomplete="email" 
              />
            </div>

            <!-- Password -->
            <div class="form-group">
              <label class="form-label" for="signup-password">Password *</label>
              <div class="password-input-wrap">
                <input 
                  type="password" 
                  id="signup-password" 
                  name="password" 
                  class="form-control" 
                  placeholder="At least 6 characters" 
                  required 
                  autocomplete="new-password" 
                  minlength="6"
                />
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('signup-password', this)" aria-label="Toggle password visibility">
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div class="password-strength-bar">
                <div id="password-strength-fill" class="password-strength-fill"></div>
              </div>
              <div class="password-strength-text">
                <span id="password-strength-label">Password strength</span>
                <span style="color:var(--color-text-light);">Min 6 characters</span>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
              <label class="form-label" for="signup-confirm-password">Confirm Password *</label>
              <div class="password-input-wrap">
                <input 
                  type="password" 
                  id="signup-confirm-password" 
                  name="confirmPassword" 
                  class="form-control" 
                  placeholder="Re-enter your password" 
                  required 
                  autocomplete="new-password" 
                  minlength="6"
                />
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('signup-confirm-password', this)" aria-label="Toggle password visibility">
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <!-- Terms & Medical Privacy Agreement -->
            <div class="form-group">
              <label class="form-checkbox-label">
                <input type="checkbox" id="signup-terms" required />
                <span>
                  I agree to the <a href="terms.html" target="_blank" rel="noopener noreferrer" style="color:var(--color-turquoise-700); text-decoration:underline;">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener noreferrer" style="color:var(--color-turquoise-700); text-decoration:underline;">Privacy Policy</a>.
                </span>
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="signup-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
              Create Account
            </button>
          </form>
        </div>

        <div class="auth-card-footer">
          Already have an account? <a href="login.html">Sign In here &rarr;</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Reusable Dynamic Footer -->
  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderHeader();
      renderFooter();

      // If user is already authenticated, redirect to dashboard
      await window.medmostAuth.redirectIfAuthenticated('dashboard.html');

      const form = document.getElementById('signup-form');
      const submitBtn = document.getElementById('signup-submit-btn');
      const alertBox = document.getElementById('auth-alert');
      const passwordInput = document.getElementById('signup-password');
      const strengthFill = document.getElementById('password-strength-fill');
      const strengthLabel = document.getElementById('password-strength-label');

      // Realtime password strength listener
      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        let score = 0;
        if (val.length >= 6) score += 25;
        if (val.length >= 8) score += 25;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 25;
        if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score += 25;

        strengthFill.style.width = score + '%';
        if (score <= 25) {
          strengthFill.style.backgroundColor = '#EF4444';
          strengthLabel.textContent = 'Weak';
          strengthLabel.style.color = '#EF4444';
        } else if (score <= 50) {
          strengthFill.style.backgroundColor = '#F59E0B';
          strengthLabel.textContent = 'Fair';
          strengthLabel.style.color = '#F59E0B';
        } else if (score <= 75) {
          strengthFill.style.backgroundColor = '#3B82F6';
          strengthLabel.textContent = 'Good';
          strengthLabel.style.color = '#3B82F6';
        } else {
          strengthFill.style.backgroundColor = '#10B981';
          strengthLabel.textContent = 'Strong';
          strengthLabel.style.color = '#10B981';
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        showAlert('', 'hide');

        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-confirm-password').value;
        const terms = document.getElementById('signup-terms').checked;

        // Validation
        if (!name) {
          showAlert('Please enter your full name.', 'error');
          document.getElementById('signup-name').focus();
          return;
        }

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showAlert('Please provide a valid email address.', 'error');
          document.getElementById('signup-email').focus();
          return;
        }

        if (!password || password.length < 6) {
          showAlert('Password must be at least 6 characters long.', 'error');
          document.getElementById('signup-password').focus();
          return;
        }

        if (password !== confirmPassword) {
          showAlert('Passwords do not match. Please re-enter identical passwords.', 'error');
          document.getElementById('signup-confirm-password').focus();
          return;
        }

        if (!terms) {
          showAlert('Please agree to the Terms of Service and Privacy Policy.', 'error');
          return;
        }

        // Set Loading State
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite; vertical-align:middle; margin-right:6px;"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
          Creating Account...
        `;

        try {
          const res = await window.medmostAuth.signUp({
            name,
            email,
            password
          });

          // Check if email confirmation is required by Supabase
          if (res.user && !res.session) {
            // Confirmation email sent
            form.style.display = 'none';
            showAlert(`
              <strong>Account Created Successfully!</strong><br />
              We have sent an email confirmation link to <strong>${escapeHtml(email)}</strong>. 
              Please click the link in your email to verify your address and access your patient dashboard.
              <br /><br />
              <small>Didn't receive an email? Check your spam folder or <a href="#" id="resend-link" style="color:var(--color-turquoise-800); text-decoration:underline; font-weight:700;">click here to resend</a>.</small>
            `, 'success');

            const resendLink = document.getElementById('resend-link');
            if (resendLink) {
              resendLink.addEventListener('click', async (ev) => {
                ev.preventDefault();
                resendLink.textContent = 'Resending...';
                try {
                  await window.medmostAuth.resendVerificationEmail(email);
                  resendLink.textContent = 'Verification email resent!';
                } catch (err) {
                  resendLink.textContent = 'Error resending: ' + err.message;
                }
              });
            }
          } else {
            // Auto signed-in (if Supabase email confirmation is disabled)
            showAlert('Account created! Redirecting to your dashboard...', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1200);
          }
        } catch (err) {
          console.error('Sign up error:', err);
          let msg = err.message || 'An error occurred during account registration. Please try again.';
          if (msg.toLowerCase().includes('already registered')) {
            msg = 'An account with this email address already exists. <a href="login.html" style="color:inherit; text-decoration:underline; font-weight:bold;">Sign in instead &rarr;</a>';
          }
          showAlert(msg, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Create Account';
        }
      });

      function showAlert(html, type) {
        if (type === 'hide') {
          alertBox.style.display = 'none';
          alertBox.innerHTML = '';
          return;
        }

        alertBox.className = `auth-alert auth-alert-${type}`;
        alertBox.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            ${type === 'error' ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'}
          </svg>
          <div>${html}</div>
        `;
        alertBox.style.display = 'flex';
      }
    });

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }
  </script>
</body>
</html>
