<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70" fill="none">
  <!-- Medical Cross & Global Orbit Symbol -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#15664B" stroke="#D4AF37" stroke-width="1.5" />
    
    <!-- Medical Cross -->
    <path d="M22 14h10v10h10v10h-10v10h-10v-10h-10v-10h10v-10z" fill="#FFFFFF" />

    <!-- Subtle Golden Global Orbit -->
    <path d="M7 38 C 12 18, 42 16, 48 24" stroke="#F3CA52" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M6 30 C 14 44, 40 46, 47 30" stroke="#F3CA52" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.8" />
    
    <circle cx="48" cy="24" r="3" fill="#F3CA52" />
    <circle cx="7" cy="38" r="2.5" fill="#34D399" />
  </g>

  <!-- Brand Typography -->
  <text x="76" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#FFFFFF">
    MED<tspan fill="#F3CA52">MOST</tspan>
  </text>
  
  <text x="77" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7.5" letter-spacing="2.2" fill="#A5C7B7">
    MEDICAL TOURISM INDIA
  </text>
</svg>
