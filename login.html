<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Login | MEDMOST Medical Tourism India</title>
  <meta name="description" content="Sign in to your MEDMOST account to view consultation status, doctor opinions, and medical travel coordination." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
</head>
<body>

  <!-- Site Header Container -->
  <div id="site-header-container"></div>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-brand-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Patient Portal
          </div>
          <h1 class="auth-card-title">Welcome Back</h1>
          <p class="auth-card-subtitle">
            Sign in to access your patient dashboard and consultation records.
          </p>
        </div>

        <div class="auth-card-body">
          <!-- Notification Alert Container -->
          <div id="auth-alert" style="display: none;"></div>

          <form id="login-form" novalidate>
            <!-- Email Address -->
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address *</label>
              <input 
                type="email" 
                id="login-email" 
                name="email" 
                class="form-control" 
                placeholder="patient@example.com" 
                required 
                autocomplete="email" 
              />
            </div>

            <!-- Password -->
            <div class="form-group">
              <label class="form-label" for="login-password">Password *</label>
              <div class="password-input-wrap">
                <input 
                  type="password" 
                  id="login-password" 
                  name="password" 
                  class="form-control" 
                  placeholder="Enter your password" 
                  required 
                  autocomplete="current-password" 
                />
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password', this)" aria-label="Toggle password visibility">
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <!-- Options Row (Remember & Forgot) -->
            <div class="form-options-row">
              <label class="form-checkbox-label" style="margin-top:0;">
                <input type="checkbox" id="login-remember" checked />
                <span>Keep me signed in</span>
              </label>
              <a href="forgot-password.html" class="form-forgot-link">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
              Sign In
            </button>
          </form>
        </div>

        <div class="auth-card-footer">
          Don't have an account yet? <a href="signup.html">Create one here &rarr;</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Reusable Dynamic Footer -->
  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderHeader();
      renderFooter();

      // Check query parameters (logged_out, verified, error, etc.)
      const params = new URLSearchParams(window.location.search);
      if (params.get('logged_out')) {
        showAlert('You have been safely signed out.', 'info');
      } else if (params.get('verified')) {
        showAlert('Your email address has been verified successfully! Please sign in below.', 'success');
      } else if (params.get('reset_success')) {
        showAlert('Your password has been reset successfully! You can now sign in with your new password.', 'success');
      }

      // If user is already authenticated, redirect to destination
      await window.medmostAuth.redirectIfAuthenticated('dashboard.html');

      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('login-submit-btn');
      const alertBox = document.getElementById('auth-alert');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        showAlert('', 'hide');

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showAlert('Please enter your valid email address.', 'error');
          document.getElementById('login-email').focus();
          return;
        }

        if (!password) {
          showAlert('Please enter your account password.', 'error');
          document.getElementById('login-password').focus();
          return;
        }

        // Set Loading State
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite; vertical-align:middle; margin-right:6px;"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
          Signing In...
        `;

        try {
          const res = await window.medmostAuth.signIn({ email, password });

          showAlert('Sign in successful! Loading your dashboard...', 'success');

          // Check redirect query param
          const redirectParam = params.get('redirect');
          const targetUrl = redirectParam ? decodeURIComponent(redirectParam) : 'dashboard.html';

          setTimeout(() => {
            window.location.href = targetUrl;
          }, 800);
        } catch (err) {
          console.error('Sign in error:', err);
          let msg = err.message || 'Invalid email or password.';
          if (msg.toLowerCase().includes('email not confirmed')) {
            msg = `
              <strong>Email Not Confirmed Yet.</strong><br />
              Please verify your email address to sign in. 
              <br /><a href="#" id="resend-verification-btn" style="color:var(--color-turquoise-800); text-decoration:underline; font-weight:700;">Click here to resend the confirmation email &rarr;</a>
            `;
          } else if (msg.toLowerCase().includes('invalid login credentials')) {
            msg = 'Invalid email or password. Please verify your credentials or use <a href="forgot-password.html" style="color:inherit; text-decoration:underline; font-weight:bold;">Forgot Password</a>.';
          }
          showAlert(msg, 'error');

          const resendBtn = document.getElementById('resend-verification-btn');
          if (resendBtn) {
            resendBtn.addEventListener('click', async (ev) => {
              ev.preventDefault();
              resendBtn.textContent = 'Sending...';
              try {
                await window.medmostAuth.resendVerificationEmail(email);
                resendBtn.textContent = 'Verification email sent! Check your inbox.';
              } catch (resendErr) {
                resendBtn.textContent = 'Error: ' + resendErr.message;
              }
            });
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In';
        }
      });

      function showAlert(html, type) {
        if (type === 'hide') {
          alertBox.style.display = 'none';
          alertBox.innerHTML = '';
          return;
        }

        alertBox.className = `auth-alert auth-alert-${type}`;
        alertBox.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            ${type === 'error' ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' : (type === 'info' ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>')}
          </svg>
          <div>${html}</div>
        `;
        alertBox.style.display = 'flex';
      }
    });

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }
  </script>
</body>
</html>
